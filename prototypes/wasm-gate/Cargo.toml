[package]
name = "wasm-gate"
version = "0.1.0"
edition = "2021"

# wasm32 gate prototype (wayfinder ticket 08): candle-core 0.11 compiled to
# wasm32-unknown-unknown, Laya + OpenThai forwards run inside linear memory
# over a plain extern "C" ABI (no wasm-bindgen; Node harness copies GGUF
# bytes in and reads logits out).
#
# Build (the getrandom cfg is REQUIRED for wasm32-unknown-unknown; see
# src/lib.rs __getrandom_v03_custom):
#   RUSTFLAGS='--cfg getrandom_backend="custom"' \
#     cargo build --release --target wasm32-unknown-unknown

[dependencies]
candle-core = "=0.11.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libm = "0.2"
half = "2"
getrandom = "0.3"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
