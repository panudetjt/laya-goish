[package]
name = "candle-laya"
version = "0.1.0"
edition = "2021"

# Prototype: candle-CPU port of the Laya English forward pass (wayfinder ticket 05).
# Not part of the engine workspace; keeps its own target dir.

[dependencies]
# candle-core 0.11.0: default features are EMPTY; gemm 0.19 + rayon are
# non-optional deps, so plain "=0.11.0" is the pure CPU gemm+rayon build.
# No mkl/accelerate/cuda.
candle-core = "=0.11.0"
rayon = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps the engine's probability label order for drift compare.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
