[package]
name = "laya-engine-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm32 extern-C ABI over the laya-engine core (wayfinder ticket 19)"

# wasm_threads gates the threads artifact's exports (wasm_set_threads +
# team.rs worker ABI); set via RUSTFLAGS by run.sh build-threads.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_threads)'] }

[lib]
name = "laya_engine_wasm"
crate-type = ["cdylib"]

[dependencies]
laya-engine = { path = ".." }

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 0
