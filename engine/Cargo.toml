[package]
name = "laya-engine"
version = "0.1.0"
edition = "2021"
description = "Laya GGUF decision inference in std Rust (port of the goish engine core)"

# wasm_threads gates the +atomics artifact's host-driven worker fan-out
# (team.rs) and serialized allocator paths (heap.rs); set via RUSTFLAGS by
# engine/wasm/run.sh build-threads.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_threads)'] }

# Lib target for the cross-compile gates (src/lib.rs mirrors main.rs's mod
# list; the bin is the shipped CLI and is unchanged). See ticket 14.
[lib]
name = "laya_engine"

[dependencies]
libm = { version = "=0.2.16", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }

unicode-normalization = { version = "=0.1.25", default-features = false }
unicode-general-category = "=1.1.0"

memmap2 = "0.9"

# Shared SIMD kernels and numeric types from the katgpt stack
# (see wayfinder/research/katgpt-rs-capability-index.md). Leaf crate — wasm32-clean,
# zero katgpt-* deps.
katgpt-types = { path = "../../katgpt-rs/crates/katgpt-types", default-features = false }

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
debug = 0
strip = "symbols"
